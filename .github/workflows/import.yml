name: Redfin import

on:
  schedule:
    # 10:00 UTC, early morning in New York
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: redfin-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Search only: listing pages sit behind a bot challenge, so details stay a local job.
      - run: npx tsx scripts/scrape-redfin.ts --no-details
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
